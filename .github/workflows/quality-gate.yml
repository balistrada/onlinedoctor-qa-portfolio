name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Install Chromium when browser tests exist
        if: hashFiles('tests/e2e/**/*.py') != ''
        run: python -m playwright install --with-deps chromium
      - name: Quality gate
        env:
          QA_RUN_SCOPE: quality-gate
          BASE_URL: https://veryops.kintree.eu
          REQUEST_INTERVAL_SECONDS: "0.35"
        run: bash scripts/quality_gate.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-gate
          path: reports/
          if-no-files-found: ignore
